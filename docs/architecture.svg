<text x="133.3" y="206" font-size="10" fill="#555">approved, signed, hashed spec drives every quarterly test</text>
<text x="440.0" y="433" font-size="10.5" fill="#b00020" text-anchor="middle">STALE: an amendment, restatement or revoked spec is a ledger event that re-opens Lane A and re-queues dependent results</text>
